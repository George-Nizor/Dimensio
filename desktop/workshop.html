    <!-- 'wasm-unsafe-eval' and connect-src data: exist only so the bundled Spark splat
         renderer can compile its inlined WebAssembly. Neither grant allows remote code:
         scripts still come from 'self' and plain 'unsafe-eval' stays denied. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: dimensio-artifact:; media-src 'self' blob: dimensio-artifact:; connect-src 'self' data: dimensio-artifact:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
