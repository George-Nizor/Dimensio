# Practice for lesson 11. The item marked main is the lesson's exercise.

- id: three-real-sizes
  main: true
  title: Three boxes at real sizes
  kind: drill
  minutes: 10
  text: In a new General file, make three boxes from cubes and stand them on the grid side by side. Make a door 0.9 m wide, 0.1 m thick and 2.1 m tall. Then make a 1 m crate and a box 0.5 by 0.3 by 1.8 m for a person. Measure the door's height with the Measure tool.
  steps: [Check the units, Read the size, Type a size, Measure a distance, Stand it on the grid]
  timer: { minutes: 10 }
  reference: { diagram: example }

- id: corner-to-corner
  title: Corner to corner
  kind: drill
  minutes: 5
  text: In a new General file, use the Measure tool with Ctrl held to measure the default cube. Measure one edge, then the diagonal across one face, then the diagonal through the cube from one corner to the opposite one.
  timer: { minutes: 5 }
  check:
    - The edge reads 2 m and the face diagonal 2.83 m.
    - The corner to corner diagonal reads 3.46 m.

- id: in-centimetres
  title: Sizes in centimetres
  kind: warm-up
  minutes: 3
  text: In a new General file, set the cube's Dimensions to 30cm, 45cm and 12cm, typing the units into the fields. Then read the fields again.
  timer: { minutes: 3 }
  check:
    - The fields read 0.3 m, 0.45 m and 0.12 m.
