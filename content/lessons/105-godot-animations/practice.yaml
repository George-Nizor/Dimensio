# Practice for lesson 105. The item marked main is the lesson's exercise.

- id: idle-and-walk-in-godot
  main: true
  title: Idle and walk in Godot
  kind: project
  minutes: 20
  text: "Key a 48-frame idle for your character, a slow breath in the chest and arms, and name it idle-loop. Rename your walk walk-loop. Stash both, export the character as a .glb and open it in Godot as an inherited scene. Play both, and set idle to play on load."
  steps: [Name the actions, Stash both, Export the character, Open it in Godot, Play each animation]
  timer: { minutes: 20 }
  reference: { model: kenney-mini-character, prompt: "Kenney's character has an idle and a walk among its 32 animations." }

- id: kenney-animations-in-godot
  title: Loop an animation in Godot
  kind: drill
  minutes: 10
  text: Open the example character in Blender and export it as a .glb. Its 32 actions sit on NLA tracks, so all of them go. Their names have no -loop, so in Godot double-click the .glb, select walk under the AnimationPlayer, set Loop Mode to Linear and click Reimport.
  timer: { minutes: 10 }
  reference: { model: kenney-mini-character }
  check:
    - Godot's AnimationPlayer lists 32 animations.
    - Walk repeats after you reimport, and sit does not.
