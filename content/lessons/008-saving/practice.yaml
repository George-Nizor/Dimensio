# Practice for lesson 8. The item marked main is the lesson's exercise.

- id: recover-a-change
  main: true
  title: Recover an unsaved change
  kind: drill
  minutes: 10
  text: Save a new General file as recover-test.blend. Add a cylinder and save again. Add a cone, then close Blender and choose Don't Save. Open Blender again, get the cone back with File > Recover > Last Session, and save the result with File > Save As.
  steps: [Save, Keep the last save, Save numbered copies, Undo and redo, Recover lost work]
  timer: { minutes: 10 }
  reference: { diagram: recover }

- id: back-through-history
  title: Back through the history
  kind: drill
  minutes: 3
  text: "In a new General file, make five changes in this order: move the cube, rotate it, scale it, add a sphere, then delete the light. Use Edit > Undo History to go back to the rotation."
  timer: { minutes: 3 }
  check:
    - The cube has moved and turned but kept its size.
    - The light is back, and there is no sphere.

- id: numbered-stool
  title: Four numbered saves
  kind: drill
  minutes: 5
  text: Save a new General file as stool_01.blend. Then three times over, add a shape and press Ctrl+Alt+S. Open the folder in File > Open to see the files.
  timer: { minutes: 5 }
  check:
    - The folder holds stool_01.blend to stool_04.blend.
    - stool_01.blend still holds only the cube.
