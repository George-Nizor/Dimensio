# Practice for lesson 117. The item marked main is the lesson's exercise.

- id: outline-the-kit
  main: true
  title: Outline your building kit
  kind: drill
  minutes: 15
  text: "Open your building kit from lesson 67 and frame its pieces with the camera. Add Collection Line Art for the kit's collection. Set Line Radius so the lines read at full size, and Crease Threshold so round parts keep only their outlines. Render it with EEVEE and save the picture."
  steps: [Point a camera at the models, Add Line Art, Set the line width, Choose which edges get lines, Render the lines]
  timer: { minutes: 15 }
  reference: { diagram: example }

- id: three-shapes-outlined
  title: Three shapes outlined
  kind: warm-up
  minutes: 5
  text: In a new General file, add a cylinder with 8 vertices and a UV sphere beside the cube. Add Scene Line Art and render. Then raise and lower Crease Threshold and render again each time.
  timer: { minutes: 5 }
  check:
    - The cube keeps all its edges while Crease Threshold stays above 90°.
    - The cylinder's side lines come and go as the threshold crosses 135°.

- id: outline-one-prop
  title: Outline one prop only
  kind: drill
  minutes: 5
  text: In your kit file, delete the Line Art object. Select one prop and add Object Line Art, then render.
  timer: { minutes: 5 }
  check:
    - Only the selected prop has lines in the render.
