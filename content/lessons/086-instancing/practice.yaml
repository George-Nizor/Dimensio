# Practice for lesson 86. The item marked main is the lesson's exercise.

- id: scatter-the-hill
  main: true
  title: Scatter rocks and trees
  kind: drill
  minutes: 20
  text: "Open the exercise. With Geometry Nodes, scatter the Rock and the Tree from the Props collection over the Hill. Give each copy a random turn and a size from 0.7 to 1.3, keep the hill, and realize the instances. Keep the scene under 20,000 triangles and add your file."
  steps: [Scatter points, Put the props on the points, Mix the props, Vary them, Make them real, Or use Scatter on Surface]
  starter: scatter-hill
  timer: { minutes: 20 }
  reference: { diagram: example }
  measure:
    - { metric: tris, max: 20000, label: "Under 20,000 triangles" }

- id: scatter-modifier
  title: The same with one modifier
  kind: drill
  minutes: 10
  text: "Open the exercise again and use Add Modifier > Generate > Scatter on Surface instead of your own nodes. Instance the Props collection with Pick Instance, turn Randomize on, untick Align Rotation and tick Realize Instances."
  starter: scatter-hill
  timer: { minutes: 10 }
  check:
    - Rocks and trees stand upright on the hill.
    - The scene stays under 20,000 triangles.

- id: rocky-beach
  title: A rocky beach
  kind: imagination
  minutes: 15
  text: "Make a flat beach from a Grid and scatter only small rocks over it, sized from 0.2 to 0.5. Use a higher Density than you used on the hill. Keep it under 10,000 triangles."
  timer: { minutes: 15 }
  check:
    - The rocks vary in size and turn.
    - The beach is under 10,000 triangles.
