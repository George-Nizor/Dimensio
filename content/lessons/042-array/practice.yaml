# Practice for lesson 42. The item marked main is the lesson's exercise.

- id: fence-and-ring
  main: true
  title: Fence and ring of stones
  kind: drill
  minutes: 15
  text: "Make a plank 10 cm wide, 2 cm deep and 1 m tall, and apply its scale. Give it an Array with Count 10 and Offset X 1.5. Then add an Ico Sphere with Subdivisions 1 and Radius 0.2 m for a stone. Give it an Array with Shape Circle, Count 12 and Radius 1 m."
  steps: [Add Array, Space them out, Make a ring]
  timer: { minutes: 15 }
  reference: { diagram: example }
  measure:
    - { metric: base.tris, max: 100, label: "One plank and one stone under the modifiers" }
    - { metric: tris, min: 300, label: "All 22 pieces made" }

- id: count-to-five
  title: Five crates in a row
  kind: warm-up
  minutes: 3
  text: "Give the default cube an Array with Count 5. Change Offset X to 1.2, then to 2, and watch the gaps open."
  timer: { minutes: 3 }
  check:
    - Five cubes sit in a row along X.
    - At Offset X 2, each gap is as wide as a cube.

- id: array-steps
  title: A flight of steps
  kind: drill
  minutes: 5
  text: "Scale a cube into one step 1 m wide, 30 cm deep and 20 cm tall, and apply the scale. Give it an Array with Count 8, then set Offset to X 0, Y 1 and Z 1."
  timer: { minutes: 5 }
  check:
    - Eight steps climb in a straight line.
    - Each step starts one step back and one step up.
