# Practice for lesson 6. The item marked main is the lesson's exercise.

- id: match-the-targets
  main: true
  title: Match the eight outlines
  kind: drill
  minutes: 15
  text: Open the exercise. Eight blue blocks stand beside wire outlines, numbered 1 to 8 on the floor. Move, rotate or scale each block until it fits its outline exactly, with G, R or S, then X, Y or Z, then a typed number. Check each one from the front, right and top views before moving on.
  steps: [Move with G, Rotate and scale, Lock to an axis, Type an amount, Snap or slow down, Use the Sidebar]
  starter: transform-targets
  timer: { minutes: 15 }
  reference: { diagram: type-amount }

- id: sidebar-only
  title: Sidebar only
  kind: drill
  minutes: 5
  text: In a new General file, use only the Sidebar's Item tab. Put the cube at Location 3, 0, 1, turn it 45 degrees around Z and set its Scale to 0.5 on every axis. Then reset all three with Alt+G, Alt+R and Alt+S.
  timer: { minutes: 5 }
  check:
    - After the reset, Location reads 0, 0, 0 and Scale reads 1.
    - You never pressed G, R or S.

- id: ctrl-steps
  title: Steps with Ctrl
  kind: warm-up
  minutes: 3
  text: In a new General file, move the cube 3 m along Y with G, Y and Ctrl held, without typing a number. Then turn it 45 degrees around Z with R, Z and Ctrl held.
  timer: { minutes: 3 }
  check:
    - The Sidebar shows Location Y 3 m and Rotation Z 45 degrees.
