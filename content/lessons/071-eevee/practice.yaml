- id: one-sample
  title: Render Samples at 1 and 64
  kind: drill
  minutes: 5
  text: Open the exercise, set Render Samples to 1 and render with F12. Save the picture, then set Render Samples back to 64, render and save again. Compare the crate's edges and the shadows in the two files.
  starter: render-stage
  timer: { minutes: 5 }
  check:
    - At 1 sample, the crate's edges step like stairs.
    - At 64 samples, the same edges look smooth.
