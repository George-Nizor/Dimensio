# Practice for lesson 3. The item marked main is the lesson's exercise.

- id: find-the-letters
  main: true
  title: Find the six letters
  kind: drill
  minutes: 10
  text: "Open the exercise in Blender. Six props stand on a floor, each with one letter on one of its faces. Find all six using only the numpad views, the gizmo, Home and Numpad . (select a prop in the Outliner first). Write the letters down from Prop 1 to Prop 6."
  steps: [Orbit, Pan and zoom, Jump to a view, Switch the projection, Find what you lost, Use the gizmo]
  starter: navigation-letters
  timer: { minutes: 10 }
  reference: { diagram: views }

- id: six-sides
  title: Six sides of the cube
  kind: warm-up
  minutes: 3
  text: In a new General file, look at the default cube from the front, back, right, left, top and bottom with the numpad. Then orbit back to a view from above and to one side.
  timer: { minutes: 3 }
  check:
    - You saw the cube from all six sides.
    - You used Ctrl for the back, left and bottom.

- id: gizmo-only
  title: The letters, with the gizmo only
  kind: drill
  minutes: 5
  text: Open the letters exercise again and find all six letters without touching the numpad. Use the navigation gizmo to change views and Home to see everything.
  starter: navigation-letters
  timer: { minutes: 5 }
  check:
    - You found all six letters without the numpad.
    - Clicking an axis letter twice showed you the opposite side.
