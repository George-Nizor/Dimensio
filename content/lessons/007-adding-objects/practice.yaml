# Practice for lesson 7. The item marked main is the lesson's exercise.

- id: row-of-primitives
  main: true
  title: A row of five primitives
  kind: drill
  minutes: 10
  text: "In a new General file, delete the cube. Add five shapes in a row along X, 2 m apart, each 1 m tall. Make a 1 m cube, an 8-sided cylinder, a 6-sided cone, a UV sphere with 12 segments and 6 rings, and an ico sphere with 1 subdivision. All but the cube have radius 0.5 m."
  steps: [Place the 3D cursor, Add a shape, Adjust it straight away, Duplicate, Delete]
  timer: { minutes: 10 }
  reference: { diagram: example }
  measure:
    - { metric: meshes, equals: 5, label: Five objects in the row }
    - { metric: tris, max: 190, label: No more than 190 triangles }

- id: cursor-first
  title: Cursor first
  kind: drill
  minutes: 5
  text: In a new General file, hold Shift and right click on top of the cube to put the 3D cursor there, and add a UV sphere. Then press Shift+C and add a cone, which appears at the centre of the world.
  timer: { minutes: 5 }
  check:
    - The middle of the sphere is on the cube's top face.
    - The cone sits at the centre, inside the cube.

- id: four-legs
  title: Four legs from one
  kind: drill
  minutes: 5
  text: "In a new General file, set the cube's Dimensions to 0.1, 0.1 and 0.8 m in the Sidebar to make a leg. Make three more legs with Alt+D, one at each corner of a 1 m square. Then open the Object Data tab of the Properties editor."
  timer: { minutes: 5 }
  check:
    - The mesh name in the Object Data tab shows 4, its number of users.
    - The four legs stand at the corners of a 1 m square.
