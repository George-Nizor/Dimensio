# Example models. Each one is a .blend in desktop/public/reference/models/ with renders from the
# front, right, top and a three-quarter view, made by desktop/scripts/reference-models.py with
# blender/dimensio_check.py. Only CC0 or public-domain models: say where a model came from
# (source) or which script in this repository builds it (made). Kenney's models were checked on
# kenney.nl on 2026-10-15; each pack's licence text is in models/LICENSES/.

- id: stool
  title: Four-legged stool
  file: models/stool/stool.blend
  renders: { persp: models/stool/persp.png, front: models/stool/front.png, right: models/stool/right.png, top: models/stool/top.png }
  credit: Made for Dimensio with a Blender script
  alt: A low stool with a square seat and four square legs. The front and back legs lean out a little.
  made: desktop/scripts/sample-models.py
  licence: CC0

