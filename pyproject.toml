[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensio"
version = "0.3.0"
description = "Dimensio's command-line tool: the Blender, Godot and local model steps the Workshop's agent runs"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
dimensio = "dimensio.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
